<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bandera de México</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🇲🇽 Bandera de México</h1>
    </header>

    <main>

        <!-- CONTROLES DEL COLOR VERDE -->
        <section class="color-section">

            <div class="titulo-color">
                <span class="circulo verde-circulo"></span>

                <div>
                    <h2>Esperanza</h2>
                    <p id="hexVerde">#006646</p>
                </div>
            </div>

            <div id="colorVerde" class="cuadro-color verde"></div>

            <div class="control">
                <label for="tonoVerde">Tono</label>
                <input
                    type="range"
                    id="tonoVerde"
                    min="0"
                    max="360"
                    value="158"
                >
            </div>

            <div class="control">
                <label for="saturacionVerde">Saturación</label>
                <input
                    type="range"
                    id="saturacionVerde"
                    min="0"
                    max="100"
                    value="100"
                >
            </div>

            <div class="control">
                <label for="luminosidadVerde">Luminosidad</label>
                <input
                    type="range"
                    id="luminosidadVerde"
                    min="0"
                    max="100"
                    value="20"
                >
            </div>

        </section>


        <!-- CENTRO DE LA BANDERA -->
        <section class="centro">

            <div class="escudo">
                <div class="aguila">🦅</div>
            </div>

        </section>


        <!-- CONTROLES DEL COLOR ROJO -->
        <section class="color-section">

            <div class="titulo-color">
                <span class="circulo rojo-circulo"></span>

                <div>
                    <h2>Sangre de nuestros héroes nacionales</h2>
                    <p id="hexRojo">#d40202</p>
                </div>
            </div>

            <div id="colorRojo" class="cuadro-color rojo"></div>

            <div class="control">
                <label for="tonoRojo">Tono</label>
                <input
                    type="range"
                    id="tonoRojo"
                    min="0"
                    max="360"
                    value="0"
                >
            </div>

            <div class="control">
                <label for="saturacionRojo">Saturación</label>
                <input
                    type="range"
                    id="saturacionRojo"
                    min="0"
                    max="100"
                    value="98"
                >
            </div>

            <div class="control">
                <label for="luminosidadRojo">Luminosidad</label>
                <input
                    type="range"
                    id="luminosidadRojo"
                    min="0"
                    max="100"
                    value="42"
                >
            </div>

        </section>

    </main>


    <!-- DATOS DEL ALUMNO -->
    <footer>

        <p>
            <strong>Nombre:</strong>
            AVRYL CHÁVEZ TAVERA
        </p>

        <p>
            <strong>Número de control:</strong>
            24200776
        </p>

    </footer>


    <script src="script.js"></script>

</body>
</html>
